<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weekly Check-In - 100 Days of Code Journal</title>
    <style>
      body {
        font-family: 'Segoe UI', sans-serif;
        background-color: #2d2d30;
        color: #ffffff;
        margin: 0;
        padding: 3em 4em;
        max-width: 900px;
        margin-left: auto;
        margin-right: auto;
        border-radius: 8px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.7);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      h1 {
        color: #4fc3f7;
        text-align: center;
        margin-bottom: 1.5em;
        font-size: 2.4em;
      }
      h2 {
        color: #ea80fc;
        border-bottom: 2px solid #5e5e5e;
        padding-bottom: 0.3em;
        margin-bottom: 1.5em;
        font-size: 1.8em;
      }
      p {
        line-height: 2;
        margin-bottom: 2em;
        font-size: 1.2em;
      }
      strong {
        color: #81d4fa;
      }
      .prompt-line {
        display: block;
        width: 100%;
        border-bottom: 2px solid #444;
        margin-top: 0.3em;
        margin-bottom: 1.5em;
        height: 1.5em;
      }
    </style>
  </head>
  <body>
    <h1>100 Days of Code Journal</h1>
    <section>
      <h2>Weekly Check-In</h2>
      <p><strong>Days Coded:</strong> <span class="prompt-line"></span></p>
      <p><strong>Hours This Week:</strong> <span class="prompt-line"></span></p>
      <p>
        <strong>Biggest Win:</strong> <span class="prompt-line"></span
        ><span class="prompt-line"></span>
      </p>
      <p>
        <strong>Challenges to Revisit:</strong> <span class="prompt-line"></span
        ><span class="prompt-line"></span>
      </p>
      <p>
        <strong>Focus for Next Week:</strong> <span class="prompt-line"></span
        ><span class="prompt-line"></span>
      </p>
      <p>
        <strong>What motivated me this week?</strong>
        <span class="prompt-line"></span><span class="prompt-line"></span>
      </p>
      <p>
        <strong>What obstacles did I overcome?</strong>
        <span class="prompt-line"></span><span class="prompt-line"></span>
      </p>
      <p>
        <strong>What habits helped me progress?</strong>
        <span class="prompt-line"></span><span class="prompt-line"></span>
      </p>
      <p>
        <strong>How can I improve my learning next week?</strong>
        <span class="prompt-line"></span><span class="prompt-line"></span>
      </p>
    </section>
  </body>
</html>
